[DEFAULT]

; --- connection ---

; Serial port. A port given on the command line (as the serial-starter does)
; overrides this value.
PORT = /dev/ttyUSB0

; Modbus RTU slave address of the PSI (default 1).
SLAVE_ADDRESS = 1

; Serial baudrate. The PSI Modbus PDF does not state the baudrate; confirm it
; on the bench with tools/psi_dump.py before relying on this.
BAUDRATE = 9600

; How often to read the inverter and update D-Bus, in seconds.
POLL_INTERVAL = 2

; --- display ---

; The PSI has no AC frequency register, so a fixed value is published.
AC_FREQUENCY = 50

; Friendly name shown in the GX device list.
PRODUCT_NAME = Offgridtec PSI

; --- DC cutoff thresholds (optional) ---

; When true, the threshold values below are written to the inverter on startup
; and exposed as writable D-Bus paths under /Settings/<name>. When false, the
; PSI keeps its own thresholds and the driver does not touch them.
;
; Tip: when the GX (or you) controls start/stop, set LVD low so the PSI's own
; low-voltage cutoff does not fight your control.
MANAGE_THRESHOLDS = false

; Volts. Values are clamped to the spec-allowed ranges for the 12 V model:
;   LVD  10.3 - 11.3   (low voltage disconnect)
;   LVDR 12.0 - 13.0   (low voltage reconnect)
;   HVDR 15.5 - 16.0   (high voltage reconnect)
;   HVD  14.0 - 15.0   (high voltage disconnect)
LVD = 10.8
LVDR = 12.5
HVDR = 16.0
HVD = 14.5
